<!-- Contact Section -->
<section id="contact" class="section">
    <div class="container">
        <h2 class="section-title">📬 Get in Touch</h2>
        <p class="section-subtitle">Have a project in mind? Let's talk. Response within 24 hours.</p>

        <!-- Contact Info Cards -->
        <div class="contact-info-grid">
            <div class="contact-info-card">
                <span class="contact-icon">📧</span>
                <h4>Email</h4>
                <a href="mailto:chhetrikaran.147@gmail.com">chhetrikaran.147@gmail.com</a>
            </div>
            <div class="contact-info-card">
                <span class="contact-icon">💻</span>
                <h4>GitHub</h4>
                <a href="https://github.com/NotMeFound" target="_blank">github.com/karanoli</a>
            </div>
            <div class="contact-info-card">
                <span class="contact-icon">🔗</span>
                <h4>LinkedIn</h4>
                <a href="https://www.linkedin.com/in/karan-chhetri-919b803b7" target="_blank">linkedin.com/in/karanoli</a>
            </div>
            <div class="contact-info-card">
                <span class="contact-icon">📍</span>
                <h4>Location</h4>
                <span>Nepal · Open to remote</span>
            </div>
        </div>

        <!-- Contact Form -->
        <form id="contact-form" class="contact-form" novalidate>
            <div class="form-grid">
                <div class="form-group">
                    <label for="contact-name">Your Name *</label>
                    <input 
                        type="text" 
                        id="contact-name" 
                        name="name" 
                        placeholder="Karan Chhetri" 
                        required 
                        minlength="2" 
                        maxlength="100"
                        autocomplete="name"
                    />
                    <span class="field-error" data-field="name"></span>
                </div>
                
                <div class="form-group">
                    <label for="contact-email">Your Email *</label>
                    <input 
                        type="email" 
                        id="contact-email" 
                        name="email" 
                        placeholder="karan@company.com" 
                        required 
                        maxlength="100"
                        autocomplete="email"
                    />
                    <span class="field-error" data-field="email"></span>
                </div>
                
                <div class="form-group span-2">
                    <label for="contact-subject">Subject *</label>
                    <input 
                        type="text" 
                        id="contact-subject" 
                        name="subject" 
                        placeholder="Interview invitation — Junior Developer" 
                        required 
                        minlength="2" 
                        maxlength="200"
                    />
                    <span class="field-error" data-field="subject"></span>
                </div>
                
                <div class="form-group span-2">
                    <label for="contact-message">Message *</label>
                    <textarea 
                        id="contact-message" 
                        name="message" 
                        rows="5" 
                        placeholder="Tell me about the role or project..." 
                        required 
                        minlength="10" 
                        maxlength="5000"
                    ></textarea>
                    <span class="field-error" data-field="message"></span>
                </div>
            </div>

            <button type="submit" id="submit-btn" class="btn-primary btn-submit">
                <span class="btn-text">📨 Send Message</span>
                <span class="btn-loading" hidden>
                    <span class="spinner"></span> Sending...
                </span>
            </button>
        </form>

        <!-- Dynamic Status Banner -->
        <div id="form-status" class="form-status" role="alert" aria-live="polite" hidden></div>
    </div>
</section>
